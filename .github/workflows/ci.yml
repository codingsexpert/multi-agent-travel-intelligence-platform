name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test:
    name: Build, Test & Security Verification
    runs-on: ubuntu-latest
    env:
      DEMO_MODE: "true"
      APP_ENV: "test"
      LANGSMITH_TRACING: "false"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Secret Scrubbing & Hygiene
        run: |
          echo "Scanning repository for accidental credential leaks..."
          # Check for forbidden secret patterns
          if grep -rnEi "(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|supabase_service_role_key=[a-zA-Z0-9_\-\.]{30,})" . \
            --exclude-dir={.git,.venv,__pycache__} --exclude={*.md,*.sql,.env.example}; then
            echo "::error::Detected unredacted credentials or private keys in repository files!"
            exit 1
          fi
          echo "Secret check passed cleanly."

      - name: Configuration Validation Check
        run: |
          python -c "from config.validator import ensure_startup_configuration; res = ensure_startup_configuration(); print('Config valid:', res.is_valid)"

      - name: Run Full Test Suite (Unit, Integration, Security, E2E)
        run: |
          python -m pytest tests/ -v --maxfail=5

      - name: Run Evaluation Smoke Tests
        run: |
          python -m pytest tests/test_evaluation_framework.py -v

      - name: Verify Health Probes
        run: |
          python -c "from services.health_service import get_health_status, get_liveness_status, get_readiness_status; h = get_health_status(); print('Overall Status:', h.overall_status); assert h.liveness; assert h.readiness"
